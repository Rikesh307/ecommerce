name: SDLC CI/CD Pipeline - Riya Group E-commerce

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Removed unsupported 'environments' key

jobs:
  # SDLC Phase 1: Code Quality & Security Scanning
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Security Analysis
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit safety
    
    - name: Code Style Check (PEP 8)
      run: |
        # Check for Python syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check for style violations
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Security Vulnerability Scan
      run: |
        # Check for known security vulnerabilities
        bandit -r . -f json -o bandit-report.json || true
        safety check --json || true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json

  # SDLC Phase 2: Testing
  testing:
    runs-on: ubuntu-latest
    name: Comprehensive Testing Suite
    needs: code-quality
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest-django
    
    - name: Run Django System Checks
      run: |
        python manage.py check --settings=ecommerce.settings.development
    
    - name: Run Database Migrations
      run: |
        python manage.py migrate --settings=ecommerce.settings.development
    
    - name: Run SDLC Compliance Tests
      run: |
        python manage.py test tests.test_sdlc_compliance --settings=ecommerce.settings.development -v 2
    
    - name: Run Application Tests with Coverage
      run: |
        coverage run --source='.' manage.py test --settings=ecommerce.settings.development
        coverage report --show-missing
        coverage xml
    
    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # SDLC Phase 3: Integration Testing
  integration-testing:
    runs-on: ubuntu-latest
    name: Integration & End-to-End Testing
    needs: testing
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary
    
    - name: Test with PostgreSQL
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      run: |
        python manage.py migrate --settings=ecommerce.settings.development
        python manage.py test --settings=ecommerce.settings.development

  # SDLC Phase 4: Security Testing
  security-testing:
    runs-on: ubuntu-latest
    name: Security Testing & SAST
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run OWASP ZAP Security Scan
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

  # SDLC Phase 5: Build & Package
  build:
    runs-on: ubuntu-latest
    name: Build & Package Application
    needs: [testing, integration-testing]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Collect Static Files
      run: |
        python manage.py collectstatic --noinput --settings=ecommerce.settings.production
    
    - name: Build Docker Image
      run: |
        docker build -t riya-group-ecommerce:${{ github.sha }} .
    
    - name: Run Container Security Scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(pwd):/tmp aquasec/trivy:latest image \
          --exit-code 0 --no-progress --format table \
          riya-group-ecommerce:${{ github.sha }}

  # SDLC Phase 6: Deployment (Production)
  deploy-production:
    runs-on: ubuntu-latest
    name: Production Deployment
    needs: [build, security-testing]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment script here
        # This could be Heroku, AWS, GCP, etc.
    
    - name: Run Post-Deployment Health Checks
      run: |
        # Health check endpoints
        curl -f https://your-domain.com/health/ || exit 1
        curl -f https://your-domain.com/status/ || exit 1
    
    - name: Notify Team
      run: |
        echo "Production deployment completed successfully!"
        # Add notification logic (Slack, email, etc.)

  # SDLC Phase 7: Post-Deployment Monitoring
  monitoring:
    runs-on: ubuntu-latest
    name: Post-Deployment Monitoring Setup
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Setup Monitoring Alerts
      run: |
        echo "Setting up production monitoring..."
        # Configure monitoring tools
        # Setup alerts for performance, errors, security
    
    - name: Performance Baseline
      run: |
        echo "Establishing performance baseline..."
        # Run performance tests against production
        # Document baseline metrics for future comparison
