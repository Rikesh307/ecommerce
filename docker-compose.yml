version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: riyagroup_db
      POSTGRES_USER: riyagroup_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riyagroup_user -d riyagroup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      DATABASE_URL: postgresql://riyagroup_user:secure_password@db:5432/riyagroup_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DB_NAME: riyagroup_db
      DB_USER: riyagroup_user
      DB_PASSWORD: secure_password
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8999:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A ecommerce worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: ecommerce.settings.production
      DATABASE_URL: postgresql://riyagroup_user:secure_password@db:5432/riyagroup_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DB_NAME: riyagroup_db
      DB_USER: riyagroup_user
      DB_PASSWORD: secure_password
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
      - rabbitmq

  nginx:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web


volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: