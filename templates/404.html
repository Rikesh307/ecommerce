{% extends 'base.html' %}

{% block title %}Page Not Found - ECommerce{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
            </div>
            <h1 class="fw-bold" style="color: #2c3e50;">404 - Page Not Found</h1>
            <p class="text-muted mb-4">Sorry, the page you're looking for doesn't exist.</p>
            <div class="d-grid gap-2">
                <a href="{% url 'home' %}" class="btn btn-lg" 
                   style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; border-radius: 10px;">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <a href="{% url 'products:product_list' %}" class="btn btn-outline-primary btn-lg" style="border-radius: 10px;">
                    <i class="fas fa-shopping-bag me-2"></i>Browse Products
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
