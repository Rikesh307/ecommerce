{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error - Riya Group{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-page">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="mb-4">Server Error</h2>
                <p class="lead mb-4">Something went wrong on our end.</p>
                <p class="text-muted mb-4">We're working to fix this issue. Please try again later.</p>
                
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-house me-2"></i>Go Home
                    </a>
                    <a href="{% url 'products:contact' %}" class="btn btn-outline-primary">
                        <i class="bi bi-envelope me-2"></i>Report Issue
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
